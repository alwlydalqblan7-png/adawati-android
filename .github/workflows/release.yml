name: Build signed release
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode production key
        env:
          KEYSTORE_BASE64: ${{ secrets.ADAWATI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Production signing key is not configured. See docs/RELEASE.md.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/adawati-release.jks"
      - name: Validate and build signed APK and AAB
        env:
          ADAWATI_KEYSTORE_PATH: ${{ runner.temp }}/adawati-release.jks
          ADAWATI_STORE_PASSWORD: ${{ secrets.ADAWATI_STORE_PASSWORD }}
          ADAWATI_KEY_ALIAS: ${{ secrets.ADAWATI_KEY_ALIAS }}
          ADAWATI_KEY_PASSWORD: ${{ secrets.ADAWATI_KEY_PASSWORD }}
        run: gradle testDebugUnitTest lintRelease assembleRelease bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Adawati-signed-release-candidate
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/adawati-release.jks"
